name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest==8.4.2
      - run: python -m pytest -q
