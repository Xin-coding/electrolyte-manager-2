[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolyte-manager-2"
version = "2.0.1"
description = "Independent long-running laboratory feedback and data acquisition console"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.1", "pyqtgraph==0.13.7", "pyserial==3.5", "numpy>=1.26,<3"]

[project.scripts]
electrolyte-manager = "em2.main:main"

[tool.setuptools.packages.find]
include = ["em2*"]

[tool.setuptools.package-data]
em2 = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
